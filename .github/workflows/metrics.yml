name: Generate profile metrics

# Nothing in the README references these cards right now, so this runs
# on demand only. Re-add the schedule below if you put the stats back.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Overview card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: b9nn
          filename: metrics/overview.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Toronto
          config_output: svg
          committer_branch: metrics-output

      - name: Languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: b9nn
          filename: metrics/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          config_output: svg
          committer_branch: metrics-output

      - name: Achievements card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: b9nn
          filename: metrics/achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          config_output: svg
          committer_branch: metrics-output
